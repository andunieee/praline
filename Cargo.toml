[package]
name = "praline"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
freya = { path = "../freya/crates/freya", features = [
  "router",
  "material-design",
  "icons-lucide",
] }
freya-winit = { path = "../freya/crates/freya-winit" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
fastrand = "2"
getrandom = "0.3"
async-io = "2"
async-channel = "2"
log = "0.4"
freya-hypereffect = { path = "../freya-hypereffect" }
freya-cop = "0.1.0"
hypereffect = { path = "../hypereffect/rust/hypereffect" }
cassis-core = { git = "https://github.com/andunieee/cassis", rev = "91380cd118223c752e58921405e2e6b78d0814b2" }
cassis-networks = { git = "https://github.com/andunieee/cassis", rev = "91380cd118223c752e58921405e2e6b78d0814b2", features = ["cashu"] }
cassis-wallet = { git = "https://github.com/andunieee/cassis", rev = "91380cd118223c752e58921405e2e6b78d0814b2", default-features = false, features = ["cashu"] }
cdk = { version = "0.17.3", default-features = false, features = ["wallet"] }
orangedb = "0.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
bip39 = "2.2.2"
bitcoin = "0.32.2"
uuid = { version = "1", features = ["v4"] }
lowercase-hex = "0.1"
tracing = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.22"
winit = { version = "0.30.12", features = ["android-native-activity", "rwh_06"] }

[lib]
name = "praline"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "praline"
path = "src/main.rs"

# freya-cop from crates.io must share the local freya (Linux primary clipboard) and hypereffect
[patch.crates-io]
freya = { path = "../freya/crates/freya" }
freya-core = { path = "../freya/crates/freya-core" }
freya-components = { path = "../freya/crates/freya-components" }
freya-winit = { path = "../freya/crates/freya-winit" }
freya-clipboard = { path = "../freya/crates/freya-clipboard" }
freya-edit = { path = "../freya/crates/freya-edit" }
freya-engine = { path = "../freya/crates/freya-engine" }
freya-icons = { path = "../freya/crates/freya-icons" }
freya-router = { path = "../freya/crates/freya-router" }
freya-material-design = { path = "../freya/crates/freya-material-design" }
freya-animation = { path = "../freya/crates/freya-animation" }
freya-sdk = { path = "../freya/crates/freya-sdk" }
freya-android = { path = "../freya/crates/freya-android" }
torin = { path = "../freya/crates/torin" }
ragnarok = { path = "../freya/crates/ragnarok" }
tiny-cache = { path = "../freya/crates/tiny-cache" }
tiny-diff = { path = "../freya/crates/tiny-diff" }
tiny-notify = { path = "../freya/crates/tiny-notify" }
pathgraph = { path = "../freya/crates/pathgraph" }
freya-hypereffect = { path = "../freya-hypereffect" }
freya-cop = { path = "../freya-cop" }
hypereffect = { path = "../hypereffect/rust/hypereffect" }
